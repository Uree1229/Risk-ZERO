name: Build mobile APK

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build installable release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: app
        run: node -p "'version=' + require('./mobile/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Prepare download file
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/RISK-ZERO-v${{ steps.app.outputs.version }}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RISK-ZERO-v${{ steps.app.outputs.version }}-apk
          path: artifacts/RISK-ZERO-v${{ steps.app.outputs.version }}.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "artifacts/RISK-ZERO-v${{ steps.app.outputs.version }}.apk" \
            --title "RISK-ZERO Mobile v${{ steps.app.outputs.version }}" \
            --notes "캡스톤 테스트용 Android APK입니다. DEMO 시나리오로 동작하며 실제 알림·신고·도어락 제어는 연결되지 않습니다."
